<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Ryan Portfolio</title><link rel="stylesheet" href="../style.css"></head><body><main class="section admin-page"><p class="kicker">PRIVATE AREA</p><h1>Portfolio admin.</h1><section id="login"><p>Manage your projects and upload portfolio files.</p><input id="pw" class="admin-input" type="password" placeholder="Admin password"><button id="loginBtn" class="admin-btn">Enter</button><p id="msg"></p></section><section id="app" hidden><div class="admin-head"><div><p class="kicker">CONTENT MANAGEMENT</p><h2>Project library</h2></div><button id="logout" class="admin-btn ghost">Log out</button></div><form id="form"><input id="id" type="hidden"><label>Title<input id="title" class="admin-input" required></label><label>Category<input id="category" class="admin-input"></label><label>Description<textarea id="description" class="admin-input"></textarea></label><div class="admin-cols"><label>Problem<textarea id="problem" class="admin-input"></textarea></label><label>Approach<textarea id="approach" class="admin-input"></textarea></label></div><label>Result<textarea id="result" class="admin-input"></textarea></label><label>Tools / tags<input id="tools" class="admin-input" placeholder="Excel, Power Query, Dashboard"></label><label>Project file<input id="file" type="file" class="admin-input"></label><div><button class="admin-btn" type="submit">Save project</button><button class="admin-btn ghost" type="button" id="clear">Clear</button></div><p id="status"></p></form><hr><h2>Projects</h2><div id="list"></div></section></main><script type="module" src="admin.js"></script></body></html>

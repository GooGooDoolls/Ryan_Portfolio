<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Ryan Portfolio</title><link rel="stylesheet" href="../style.css"></head>
<body>
<main class="section admin-page">
  <p class="kicker">PRIVATE AREA</p><h1>Portfolio admin.</h1>
  <section id="login"><p>Manage projects, visibility, order, thumbnails, and project files.</p><input id="pw" class="admin-input" type="password" placeholder="Admin password"><button id="loginBtn" class="admin-btn">Enter</button><p id="msg"></p></section>
  <section id="app" hidden>
    <div class="admin-head"><div><p class="kicker">CONTENT MANAGEMENT</p><h2>Project library</h2></div><button id="logout" class="admin-btn ghost">Log out</button></div>
    <form id="form">
      <input id="id" type="hidden">
      <div class="admin-cols"><label>Title<input id="title" class="admin-input" required></label><label>Category<input id="category" class="admin-input" placeholder="MANUFACTURING ANALYTICS"></label></div>
      <label>Description<textarea id="description" class="admin-input"></textarea></label>
      <div class="admin-cols"><label>Problem<textarea id="problem" class="admin-input"></textarea></label><label>Approach<textarea id="approach" class="admin-input"></textarea></label></div>
      <label>Result<textarea id="result" class="admin-input"></textarea></label>
      <label>Tools / tags<input id="tools" class="admin-input" placeholder="Excel, Power Query, Power BI"></label>
      <div class="admin-cols">
        <label>Project thumbnail <input id="thumbnail" type="file" accept="image/*" class="admin-input"></label>
        <label>Project files <input id="files" type="file" multiple class="admin-input"><small class="admin-help">Excel, PDF, Power BI, PPTX, ZIP, images, etc.</small></label>
      </div>
      <div class="admin-options"><label class="check-option"><input id="published" type="checkbox" checked><span>Published</span><small>Visible on public portfolio</small></label><label class="check-option"><input id="featured" type="checkbox"><span>Featured</span><small>Moves project to the top</small></label></div>
      <div><button class="admin-btn" type="submit">Save project</button><button class="admin-btn ghost" type="button" id="clear">Clear</button></div>
      <p id="status"></p>
    </form>
    <hr><div class="admin-list-head"><h2>Projects</h2><span>Drag to reorder</span></div><div id="list"></div>
  </section>
</main>
<script type="module" src="admin.js"></script>
</body></html>
